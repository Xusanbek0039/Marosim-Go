      - address
      - created_at
      - id
      - name
      - responsible_user
      - updated_at
    StudioRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        profile_picture:
          type: string
          format: binary
          nullable: true
