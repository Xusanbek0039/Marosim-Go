openapi: 3.0.3
info:
  title: MarosimGo API
  version: 2.0.0
  description: |-
    MarosimGo REST API (v1). Login identifikatori — telefon raqam (E.164).

    * **Mobil:** `X-Client: mobile` + `Authorization: Bearer <access>`.
    * **Web panel:** httpOnly cookie + `X-CSRFToken`.

    Har bir operatsiyada `x-access` (rol/ruxsat) va standart xato javoblari avtomatik hujjatlashtiriladi.
paths:
  /api/v1/admin/storage/google/callback/:
    get:
      operationId: admin_storage_google_callback_retrieve
      description: |-
        Google shu manzilga brauzerni yo'naltiradi. JWT talab qilinmaydi — so'rov bir martalik `state` va bog'lovchi cookie orqali aynan ulashni boshlagan Super Admin'ga bog'lanadi. Javob har doim panelga 302 redirect: `?google=connected` yoki `?google=error&reason=<kod>`.

        **Ruxsat:** Ochiq (public)
      summary: Google OAuth callback (brauzer redirect)
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - storage
      security:
      - {}
      responses:
        '302':
          description: Panelga qaytish
        '429':
          description: throttled / account_locked — `details.retry_after` soniyalarda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-access:
        auth_required: false
        roles: []
        permission: null
        label: Ochiq (public)
  /api/v1/admin/storage/google/connect/:
    get:
      operationId: admin_storage_google_connect_retrieve
      description: |-
        Google rozilik sahifasi URL'ini qaytaradi; panel brauzerni shu URL'ga yo'naltiradi. Bir martalik `state` (10 daqiqa), PKCE va brauzerga bog'lovchi httpOnly cookie yaratiladi.

        **Ruxsat:** Faqat SUPER_ADMIN
      summary: Google Drive'ni ulashni boshlash
      tags:
      - storage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleDriveConnect'
          description: ''
        '401':
          description: not_authenticated / invalid_credentials / session_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: permission_denied — rol yoki ruxsat yetarli emas (yoki CSRF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: throttled / account_locked — `details.retry_after` soniyalarda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-access:
        auth_required: true
        roles:
        - SUPER_ADMIN
        permission: null
        label: Faqat SUPER_ADMIN
  /api/v1/admin/storage/google/disconnect/:
    post:
      operationId: admin_storage_google_disconnect_create
      description: |-
        Refresh token Google'da revoke qilinadi (best effort) va serverdan o'chiriladi.

        **Ruxsat:** Faqat SUPER_ADMIN
      summary: Google Drive'ni uzish
      tags:
