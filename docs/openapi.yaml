components:
  schemas:
    AcceptResult:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationAcceptStatusEnum'
          description: |-
            PENDING_APPROVAL: egalik marosimning mavjud egalari tasdiqlagandan keyin ochiladi.

            * `ACCEPTED` - ACCEPTED
            * `PENDING_APPROVAL` - PENDING_APPROVAL
        access_role:
          $ref: '#/components/schemas/CeremonyAccessRoleEnum'
        ceremony:
          allOf:
          - $ref: '#/components/schemas/MyCeremony'
          nullable: true
          description: Kirish ochilgan bo'lsa (va marosim DRAFT emas).
      required:
      - access_role
      - ceremony
      - status
    AccessDurationEnum:
      enum:
      - 24H
      - 3D
      - 1W
      - 1M
      type: string
      description: |-
        * `24H` - 24 soat
        * `3D` - 3 kun
        * `1W` - 1 hafta
        * `1M` - 1 oy
    AccessStatusEnum:
      enum:
      - INVITED
      - ACTIVE
      - DECLINED
      - REVOKED
      type: string
      description: |-
        * `INVITED` - INVITED
        * `ACTIVE` - ACTIVE
        * `DECLINED` - DECLINED
        * `REVOKED` - REVOKED
    Admin:
      type: object
      description: |-
        Create/update/read accounts managed by the panel.

        ``pinfl`` and ``password`` are write-only; reads only ever expose ``pinfl_masked``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          maxLength: 32
        is_phone_verified:
          type: boolean
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        pinfl_masked:
          type: string
          readOnly: true
          nullable: true
        profile_picture:
          type: string
          format: uri
          nullable: true
        address:
          type: string
          maxLength: 255
        role:
          allOf:
          - $ref: '#/components/schemas/AdminRoleEnum'
          readOnly: true
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi kirish
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
          maxItems: 15
      required:
      - created_at
      - full_name
      - id
      - is_phone_verified
      - last_login
      - pinfl_masked
      - role
      - updated_at
    AdminRequest:
      type: object
      description: |-
        Create/update/read accounts managed by the panel.

        ``pinfl`` and ``password`` are write-only; reads only ever expose ``pinfl_masked``.
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        pinfl:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 32
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
          maxItems: 15
    AdminRoleEnum:
      enum:
      - ADMIN
      type: string
      description: '* `ADMIN` - Admin'
    AdminVenue:
      type: object
      description: |-
        A venue in the Super Admin / Admin panel: everything, incl. block and publication status.

        Changing ``publication_status`` additionally needs ``venues.publish`` (checked in the view).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 4000
        venue_type:
          $ref: '#/components/schemas/VenueTypeEnum'
        address:
          type: string
          maxLength: 255
        region:
          $ref: '#/components/schemas/VenueRegionEnum'
        district:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        phone_number:
          type: string
          maxLength: 32
        cover_image:
          type: string
          format: uri
          nullable: true
        capacity_min:
          type: integer
          maximum: 100000
          minimum: 0
        capacity_max:
          type: integer
          maximum: 100000
          minimum: 1
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
        is_active:
          type: boolean
        publication_status:
          $ref: '#/components/schemas/VenuePublicationStatusEnum'
        halls:
          type: array
          items:
            $ref: '#/components/schemas/VenueHall'
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/VenueImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/VenueOwnerBrief'
          readOnly: true
      required:
      - address
      - base_price
      - capacity_max
      - created_at
      - currency
      - halls
      - id
      - images
      - members
      - name
      - region
      - updated_at
    AdminVenueRequest:
      type: object
      description: |-
        A venue in the Super Admin / Admin panel: everything, incl. block and publication status.

        Changing ``publication_status`` additionally needs ``venues.publish`` (checked in the view).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 4000
        venue_type:
          $ref: '#/components/schemas/VenueTypeEnum'
        address:
