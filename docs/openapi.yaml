components:
  schemas:
    Admin:
      type: object
      description: |-
        Create/update/read accounts managed by the panel.

        ``pinfl`` and ``password`` are write-only; reads only ever expose ``pinfl_masked``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          maxLength: 32
        is_phone_verified:
          type: boolean
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        pinfl_masked:
          type: string
          readOnly: true
          nullable: true
        profile_picture:
          type: string
          format: uri
          nullable: true
        address:
          type: string
          maxLength: 255
        role:
          allOf:
          - $ref: '#/components/schemas/AdminRoleEnum'
          readOnly: true
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi kirish
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
          maxItems: 10
      required:
      - created_at
      - full_name
      - id
      - is_phone_verified
      - last_login
      - pinfl_masked
      - role
      - updated_at
    AdminRequest:
      type: object
      description: |-
        Create/update/read accounts managed by the panel.

        ``pinfl`` and ``password`` are write-only; reads only ever expose ``pinfl_masked``.
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        pinfl:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 32
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
          maxItems: 10
    AdminRoleEnum:
      enum:
      - ADMIN
      type: string
      description: '* `ADMIN` - Admin'
    BlankEnum:
      enum:
      - ''
    DashboardOverview:
      type: object
      properties:
        totals:
          type: object
          additionalProperties:
            type: integer
        role_distribution:
          type: array
          items:
            type: object
            additionalProperties: {}
        recent_profiles:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        generated_at:
          type: string
          format: date-time
      required:
      - generated_at
      - recent_profiles
      - role_distribution
      - totals
    ErrorCategoryEnum:
      enum:
      - validation
      - authentication
      - permission
      - not_found
      - method_not_allowed
      - conflict
      - payload
      - throttled
      - client_error
      - server_error
      type: string
      description: |-
        * `` - —
        * `validation` - Validatsiya
        * `authentication` - Autentifikatsiya
        * `permission` - Ruxsat
        * `not_found` - Topilmadi
        * `method_not_allowed` - Metod
        * `conflict` - Konflikt
        * `payload` - So'rov hajmi/format
        * `throttled` - Throttling
        * `client_error` - Mijoz xatosi
        * `server_error` - Server xatosi
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Yuborilgan ma'lumotlar noto'g'ri.
            details:
              type: object
