openapi: 3.0.3
info:
  title: MarosimGo API
  version: 2.0.0
  description: |-
    MarosimGo REST API (v1). Login identifikatori — telefon raqam (E.164).

    * **Mobil:** `X-Client: mobile` + `Authorization: Bearer <access>`.
    * **Web panel:** httpOnly cookie + `X-CSRFToken`.

    Har bir operatsiyada `x-access` (rol/ruxsat) va standart xato javoblari avtomatik hujjatlashtiriladi.
paths:
  /api/v1/admin/storage/google/callback/:
    get:
      operationId: admin_storage_google_callback_retrieve
      description: |-
        Google shu manzilga brauzerni yo'naltiradi. JWT talab qilinmaydi — so'rov bir martalik `state` va bog'lovchi cookie orqali aynan ulashni boshlagan Super Admin'ga bog'lanadi. Javob har doim panelga 302 redirect: `?google=connected` yoki `?google=error&reason=<kod>`.

        **Ruxsat:** Ochiq (public)

        **Shartlar:**
        * JWT talab qilinmaydi (Google brauzer redirect'i), lekin faqat ulashni boshlagan faol SUPER_ADMIN uchun yakunlanadi: bir martalik `state` + brauzerga bog'lovchi httpOnly cookie
      summary: Google OAuth callback (brauzer redirect)
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - storage
      security:
      - {}
      responses:
        '302':
          description: Panelga qaytish
        '429':
          description: throttled / account_locked — `details.retry_after` soniyalarda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-access:
        auth_required: false
        roles:
        - PUBLIC
        permission: null
        label: Ochiq (public)
      x-allowed-roles:
      - PUBLIC
      x-auth-type: NONE
      x-required-permissions: []
      x-ownership-scope: null
      x-access-conditions:
      - 'JWT talab qilinmaydi (Google brauzer redirect''i), lekin faqat ulashni boshlagan
        faol SUPER_ADMIN uchun yakunlanadi: bir martalik `state` + brauzerga bog''lovchi
        httpOnly cookie'
      x-access-status: DERIVED
      x-access-policy:
        allowed_roles:
        - PUBLIC
        auth_type: NONE
        required_permissions: []
        role_requirements: {}
        ownership_scope: null
        conditions:
        - 'JWT talab qilinmaydi (Google brauzer redirect''i), lekin faqat ulashni
          boshlagan faol SUPER_ADMIN uchun yakunlanadi: bir martalik `state` + brauzerga
          bog''lovchi httpOnly cookie'
        permission_classes:
        - AllowAny
        status: DERIVED
        review_reasons: []
        label: Ochiq (public)
      x-api-version: v1
      x-documentation:
        status: DOCUMENTED
        missing: []
