  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Noto'g'ri telefon, noto'g'ri parol va nofaol hisob uchun bir xil `401 invalid_credentials` qaytadi. Ketma-ket muvaffaqiyatsiz urinishlardan so'ng hisob vaqtincha bloklanadi (`429 account_locked`).

        **Ruxsat:** Ochiq (public)
      summary: Tizimga kirish (telefon + parol)
      parameters:
      - in: header
        name: X-Client
        schema:
          type: string
          enum:
          - mobile
        description: '`mobile` — tokenlar javob tanasida qaytadi. Yuborilmasa: web
          panel (httpOnly cookie + CSRF).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              TelefonVaParol:
                value:
                  phone_number: '+998901234567'
                  password: SecurePassword123!
                summary: Telefon va parol
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          description: validation_error — maydonlar bo'yicha xatolar `details` ichida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
