          type: string
          minLength: 1
          maxLength: 255
        responsible_user_id:
          type: string
          format: uuid
          writeOnly: true
        is_active:
          type: boolean
      required:
      - address
      - name
      - responsible_user_id
    UserSummary:
      type: object
      description: Compact, safe representation used inside other resources (studios,
        dashboard).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        profile_picture:
          type: string
          format: uri
          nullable: true
          readOnly: true
        pinfl_masked:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - full_name
      - id
      - is_active
      - last_name
      - pinfl_masked
      - profile_picture
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Mobil: Authorization: Bearer <access>. Web panel: httpOnly cookie
        + X-CSRFToken.'
