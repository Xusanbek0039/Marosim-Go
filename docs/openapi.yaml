        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pinfl
        schema:
          type: string
        description: JSHSHIR (aniq moslik)
      - in: query
        name: role
        schema:
          type: string
          enum:
          - STUDIO
          - USER
        description: |-
          * `USER` - Foydalanuvchi
          * `STUDIO` - Studiya
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
