    get:
      operationId: admin_storage_google_connect_retrieve
      description: |-
        Google rozilik sahifasi URL'ini qaytaradi; panel brauzerni shu URL'ga yo'naltiradi. Bir martalik `state` (10 daqiqa), PKCE va brauzerga bog'lovchi httpOnly cookie yaratiladi.

