        ``pinfl`` and ``password`` are write-only; reads only ever expose ``pinfl_masked``.
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        pinfl:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 32
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/ManagedUserRoleEnum'
        is_active:
          type: boolean
    PatchedMeUpdateRequest:
      type: object
      description: Self-service profile edit. Everything security-relevant (role,
        flags, phone, PINFL) is absent on purpose.
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 255
    PatchedStudioRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          minLength: 1
          maxLength: 255
        responsible_user_id:
          type: string
          format: uuid
          writeOnly: true
        is_active:
          type: boolean
    PermissionDef:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        module_label:
          type: string
        label:
          type: string
      required:
      - code
      - label
      - module
      - module_label
    PermissionsEnum:
      enum:
      - dashboard.view
      - users.view
      - users.create
      - users.update
      - users.delete
      - users.view_pinfl
      - studios.view
      - studios.create
      - studios.update
      - studios.delete
      type: string
      description: |-
        * `dashboard.view` - dashboard.view
        * `users.view` - users.view
        * `users.create` - users.create
        * `users.update` - users.update
        * `users.delete` - users.delete
        * `users.view_pinfl` - users.view_pinfl
        * `studios.view` - studios.view
        * `studios.create` - studios.create
        * `studios.update` - studios.update
        * `studios.delete` - studios.delete
    PinflReveal:
      type: object
      properties:
        pinfl:
          type: string
      required:
      - pinfl
    ProviderEnum:
      enum:
      - GOOGLE_DRIVE
      type: string
      description: '* `GOOGLE_DRIVE` - Google Drive'
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
    RegisterRequest:
      type: object
      description: Public sign-up. The role is always USER; any role/flag sent by
        the client is ignored.
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - password_confirm
      - phone_number
    RequestLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
        method:
          type: string
          readOnly: true
        path:
          type: string
          readOnly: true
        route:
          type: string
          readOnly: true
        status_code:
          type: integer
          readOnly: true
        duration_ms:
          type: number
          format: double
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        error_category:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ErrorCategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - duration_ms
      - error_category
      - id
      - method
      - path
      - request_id
      - route
      - status_code
      - timestamp
      - user_id
    RoleEnum:
      enum:
      - SUPER_ADMIN
      - ADMIN
      - STUDIO
      - USER
      type: string
      description: |-
        * `SUPER_ADMIN` - Super Admin
        * `ADMIN` - Admin
        * `STUDIO` - Studiya
        * `USER` - Foydalanuvchi
    StorageConnection:
      type: object
      description: Public facts only — the model holding the refresh token is a different
        table.
      properties:
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StorageConnectionStatusEnum'
          readOnly: true
        account_email:
          type: string
          format: email
          readOnly: true
        root_folder_id:
          type: string
          readOnly: true
        root_folder_name:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        connected_by:
          type: string
          nullable: true
          readOnly: true
        connected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_success_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error_code:
          type: string
          readOnly: true
      required:
      - account_email
      - connected_at
      - connected_by
      - last_checked_at
      - last_error_code
      - last_success_at
      - provider
      - root_folder_id
      - root_folder_name
      - scopes
      - status
    StorageConnectionStatusEnum:
      enum:
      - DISCONNECTED
      - CONNECTED
      - RECONNECT_REQUIRED
      - ERROR
      type: string
      description: |-
        * `DISCONNECTED` - Ulanmagan
        * `CONNECTED` - Ulangan
        * `RECONNECT_REQUIRED` - Qayta ulash kerak
        * `ERROR` - Xatolik
    Studio:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        profile_picture:
          type: string
          format: uri
          nullable: true
        address:
          type: string
          maxLength: 255
        responsible_user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - id
      - name
      - responsible_user
      - updated_at
    StudioRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        profile_picture:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          minLength: 1
          maxLength: 255
        responsible_user_id:
          type: string
          format: uuid
          writeOnly: true
        is_active:
          type: boolean
      required:
      - address
      - name
      - responsible_user_id
    TokenPair:
      type: object
      description: |-
        Body of login/register/refresh. Tokens are only in the body for ``X-Client: mobile``;
        the web panel receives them as httpOnly cookies instead.
      properties:
        user:
          $ref: '#/components/schemas/Me'
        access:
          type: string
          description: 'Faqat X-Client: mobile'
        refresh:
          type: string
          description: 'Faqat X-Client: mobile'
      required:
      - user
    UserSummary:
      type: object
      description: Compact, safe representation used inside other resources (studios,
        dashboard).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
          title: Telefon raqam
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        profile_picture:
          type: string
          format: uri
          nullable: true
          readOnly: true
        pinfl_masked:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - full_name
      - id
      - is_active
      - last_name
      - phone_number
      - pinfl_masked
      - profile_picture
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Mobil: Authorization: Bearer <access>. Web panel: httpOnly cookie
        + X-CSRFToken.'
